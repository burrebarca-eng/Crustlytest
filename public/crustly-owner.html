<style>
:root {
  --bg:#0e0d0a; --surf:#161410; --surf2:#1e1c17; --surf3:#252219;
  --bdr:#2a2720; --bdr2:#332f26;
  --orange:#f05a1a; --odim:#f05a1a18;
  --green:#3db870; --gdim:#3db87018;
  --red:#e84040; --rdim:#e8404018;
  --yellow:#f0b429; --ydim:#f0b42918;
  --tx:#f0ece0; --tx2:#c4bfb0; --mt:#6a6458;
  --fd:'Bebas Neue',sans-serif; --fm:'DM Mono',monospace; --fb:'DM Sans',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{background:var(--bg);color:var(--tx);font-family:var(--fb);overflow:hidden;display:flex;flex-direction:column;}

/* ── LOGIN ── */
#loginScreen{
  position:fixed;inset:0;z-index:200;
  display:flex;align-items:center;justify-content:center;
  background:#0e0d0a;
}
.login-wrap{width:100%;max-width:400px;padding:24px;}
.login-logo{font-family:var(--fd);font-size:36px;color:var(--orange);letter-spacing:3px;text-align:center;margin-bottom:4px;}
.login-sub{font-family:var(--fm);font-size:9px;letter-spacing:2.5px;color:var(--mt);text-align:center;margin-bottom:32px;}
.login-card{background:var(--surf);border:1.5px solid var(--bdr);border-radius:16px;padding:32px;}
.login-title{font-family:var(--fd);font-size:24px;letter-spacing:2px;margin-bottom:20px;}
.l-field{margin-bottom:12px;}
.l-lbl{font-family:var(--fm);font-size:8px;letter-spacing:2px;color:var(--mt);margin-bottom:5px;display:block;}
.l-inp{width:100%;background:var(--surf2);border:1.5px solid var(--bdr);border-radius:8px;padding:11px 14px;font-family:var(--fb);font-size:14px;color:var(--tx);outline:none;transition:border-color .15s;}
.l-inp:focus{border-color:var(--orange);}
.l-inp::placeholder{color:var(--mt);}
.l-err{background:var(--rdim);border:1px solid var(--red)30;border-radius:6px;padding:10px 14px;font-family:var(--fm);font-size:11px;color:var(--red);margin-bottom:12px;display:none;}
.btn-login{width:100%;background:var(--orange);color:#fff;border:none;border-radius:8px;padding:13px;font-family:var(--fd);font-size:20px;letter-spacing:2px;cursor:pointer;transition:all .15s;margin-bottom:10px;}
.btn-login:hover{opacity:.88;}
.btn-login:disabled{opacity:.5;cursor:not-allowed;}
.btn-demo{width:100%;background:none;border:1.5px solid var(--bdr);color:var(--mt);border-radius:8px;padding:11px;font-family:var(--fm);font-size:10px;letter-spacing:2px;cursor:pointer;transition:all .15s;}
.btn-demo:hover{border-color:var(--orange);color:var(--orange);}
.demo-hint{font-family:var(--fm);font-size:9px;color:var(--mt);text-align:center;margin-top:16px;letter-spacing:1px;}

/* ── MAIN APP ── */
#app{display:none;flex:1;flex-direction:column;height:100%;overflow:hidden;}

/* Topbar */
.topbar{
  background:var(--surf);border-bottom:1.5px solid var(--bdr);
  height:54px;flex-shrink:0;display:flex;align-items:center;
  justify-content:space-between;padding:0 24px;
}
.tb-left{display:flex;align-items:center;gap:16px;}
.tb-logo{font-family:var(--fd);font-size:20px;color:var(--orange);letter-spacing:2px;}
.tb-rest{font-family:var(--fm);font-size:10px;letter-spacing:1.5px;color:var(--mt);background:var(--surf2);border:1px solid var(--bdr);border-radius:5px;padding:4px 10px;}
.tb-right{display:flex;align-items:center;gap:8px;}
.tb-mode{font-family:var(--fm);font-size:9px;letter-spacing:1.5px;padding:4px 10px;border-radius:4px;}
.tb-mode.demo{background:var(--ydim);color:var(--yellow);}
.tb-mode.live{background:var(--gdim);color:var(--green);}
.btn-logout{background:none;border:1px solid var(--bdr);border-radius:6px;padding:5px 12px;font-family:var(--fm);font-size:9px;letter-spacing:1.5px;color:var(--mt);cursor:pointer;transition:all .15s;}
.btn-logout:hover{border-color:var(--red);color:var(--red);}

/* Nav tabs */
.navtabs{background:var(--surf);border-bottom:1.5px solid var(--bdr);padding:0 24px;display:flex;gap:2px;flex-shrink:0;}
.ntab{font-family:var(--fm);font-size:10px;letter-spacing:2px;padding:12px 16px;cursor:pointer;color:var(--mt);border:none;background:none;border-bottom:2px solid transparent;transition:all .15s;margin-bottom:-2px;}
.ntab:hover{color:var(--tx2);}
.ntab.on{color:var(--orange);border-bottom-color:var(--orange);}

/* Content */
.content{flex:1;overflow-y:auto;padding:24px;scrollbar-width:thin;scrollbar-color:var(--bdr2) transparent;}

/* ── KPI STRIP ── */
.kpi-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px;}
.kpi{background:var(--surf);border:1.5px solid var(--bdr);border-radius:12px;padding:20px 22px;transition:border-color .15s;}
.kpi:hover{border-color:var(--bdr2);}
.kpi-lbl{font-family:var(--fm);font-size:8px;letter-spacing:2.5px;color:var(--mt);margin-bottom:8px;}
.kpi-val{font-family:var(--fd);font-size:32px;letter-spacing:1px;color:var(--tx);line-height:1;}
.kpi-sub{font-family:var(--fm);font-size:9px;color:var(--mt);margin-top:5px;}
.kpi-sub.up{color:var(--green);}
.kpi-sub.dn{color:var(--red);}

/* ── GRID ── */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:16px;}

/* ── CARD ── */
.card{background:var(--surf);border:1.5px solid var(--bdr);border-radius:12px;overflow:hidden;}
.card-head{padding:16px 20px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;justify-content:space-between;}
.card-title{font-family:var(--fd);font-size:18px;letter-spacing:1.5px;color:var(--tx);}
.card-body{padding:16px 20px;}

/* ── TABLE ── */
.tbl{width:100%;border-collapse:collapse;}
.tbl th{font-family:var(--fm);font-size:8px;letter-spacing:2px;color:var(--mt);padding:8px 10px;text-align:left;border-bottom:1px solid var(--bdr);}
.tbl td{padding:10px 10px;font-size:13px;border-bottom:1px solid var(--bdr);vertical-align:middle;}
.tbl tr:last-child td{border-bottom:none;}
.tbl tbody tr:hover{background:var(--surf2);}

/* Status badges */
.badge{font-family:var(--fm);font-size:8px;letter-spacing:1.5px;padding:3px 8px;border-radius:4px;white-space:nowrap;}
.badge-new{background:var(--odim);color:var(--orange);}
.badge-preparing{background:var(--ydim);color:var(--yellow);}
.badge-done{background:var(--gdim);color:var(--green);}
.badge-cancelled{background:var(--rdim);color:var(--red);}

/* ── BEST SELLERS ── */

.seller-row:last-child{border-bottom:none;}
.seller-rank{font-family:var(--fd);font-size:22px;color:var(--bdr2);width:28px;text-align:center;}
.seller-info{flex:1;}

.seller-count{font-family:var(--fm);font-size:10px;color:var(--mt);margin-top:1px;}

/* ── CUSTOMER TAB ── */

/* ── SETTINGS TAB ── */

/* Toggle */
.toggle{position:relative;width:44px;height:24px;cursor:pointer;}
.toggle input{opacity:0;width:0;height:0;}
.toggle-slider{position:absolute;inset:0;background:var(--bdr2);border-radius:24px;transition:.3s;}
.toggle-slider::before{content:'';position:absolute;width:18px;height:18px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.3s;}
.toggle input:checked+.toggle-slider{background:var(--orange);}
.toggle input:checked+.toggle-slider::before{transform:translateX(20px);}

.orange{color:var(--orange);}
.green{color:var(--green);}

.muted{color:var(--mt);}

// ============================================================
// SUPABASE — direkt fetch, ingen CDN behövs
// ============================================================
let _authToken = SUPA_KEY; // börjar som anon, byts till JWT efter inloggning

async function sbFetch(path, opts = {}) {
  const { prefer, body, method, headers: extraHeaders, ...restOpts } = opts;
  const res = await fetch(SUPA_URL + '/rest/v1/' + path, {
    ...restOpts,
    method: method || 'GET',
    body: body || undefined,
    headers: {
      'apikey': SUPA_KEY,
      'Authorization': 'Bearer ' + _authToken,
      'Content-Type': 'application/json',
      'Prefer': prefer || 'return=representation',
      ...(extraHeaders || {})
    }
  });
  if (!res.ok) { console.error('sbFetch error', res.status, method||'GET', path); return null; }
  const text = await res.text();
  if (!text || text === '') return [];
  try { return JSON.parse(text); } catch(e) { return null; }
}

// Auto-login om session finns i localStorage
document.addEventListener('DOMContentLoaded', async () => {
  try {
    const saved = localStorage.getItem('crustly_session');
    if (saved) {
      const sess = JSON.parse(saved);
      if (sess.expires_at > Date.now() / 1000) {
        _authToken = sess.access_token;
        await loadRestaurantForUser({ id: sess.user_id, email: sess.email });
        return;
      } else {
        localStorage.removeItem('crustly_session');
      }
    }
  } catch(e) { console.error('Session restore fel:', e); }
});

// ============================================================
// SUPABASE HJÄLPFUNKTIONER
// ============================================================
async function __login(email, password) {
  const res = await fetch(SUPA_URL + '/auth/v1/token?grant_type=password', {
    method: 'POST',
    headers: { 'apikey': SUPA_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify({ email, password })
  });
  const data = await res.json();
  if (!res.ok) return { success: false, error: data.error_description || data.msg || 'Fel e-post eller lösenord' };
  _authToken = data.access_token;
  // Spara session
  localStorage.setItem('crustly_session', JSON.stringify({
    access_token: data.access_token,
    expires_at: data.expires_at,
    user_id: data.user.id,
    email: data.user.email
  }));
  return { success: true, user: data.user };
}
async function __logout() {
  _authToken = SUPA_KEY;
  localStorage.removeItem('crustly_session');
}
async function __getMyRestaurant(userId) {
  const rows = await sbFetch('restaurants?owner_uid=eq.' + userId + '&limit=1');
  return (rows && rows.length) ? rows[0] : null;
}
async function __getOrders(restaurantId, opts) {
  let path = 'orders?restaurant_id=eq.' + restaurantId + '&order=created_at.desc';
  if (opts?.limit) path += '&limit=' + opts.limit;
  const rows = await sbFetch(path);
  return rows || [];
}
async function __getCustomers(restaurantId) {
  const rows = await sbFetch('customers?restaurant_id=eq.' + restaurantId + '&order=last_order_at.desc');
  return rows || [];
}
async function __updateRestaurant(restaurantId, updates) {
  const rows = await sbFetch('restaurants?id=eq.' + restaurantId, {
    method: 'PATCH',
    prefer: 'return=representation',
    body: JSON.stringify(updates)
  });
  if (!rows || !rows.length) return { success: false, error: 'Uppdatering misslyckades' };
  return { success: true, restaurant: rows[0] };
}

  if (!email || !pw) { showErr('Fyll i e-post och lösenord.'); return; }

  // Demo shortcut
  if (email === 'owner@pizzaroma.se' && pw === 'pizza123') { demoLogin(); return; }

  btn.disabled = true; btn.textContent = 'LOGGAR IN...';

  const result = await __login(email, pw);
  if (result.success) {
    await loadRestaurantForUser(result.user);
  } else {
    showErr(result.error);
    btn.disabled = false; btn.textContent = 'LOGGA IN';
  }
}

async function loadRestaurantForUser(user) {
  try {
    const rest = await __getMyRestaurant(user.id);
    if (!rest) {
      showErr('Ingen restaurang kopplad till detta konto.');
      await window.__logout();
      document.getElementById('lBtn').disabled=false;
      document.getElementById('lBtn').textContent='LOGGA IN';
      return;
    }
    isDemoMode = false;
    restaurant = { ...rest, isÖppet: rest.is_open ?? rest.isÖppet ?? true };
    menu = normalizeMeny(rest.menu || []);
    await loadSupabaseData();
  } catch(e) {
    showErr('Kunde inte ladda restaurangdata. Försök igen.');
    document.getElementById('lBtn').disabled=false;
    document.getElementById('lBtn').textContent='LOGGA IN';
  }
}

function demoLogin() {
  isDemoMode = true;
  restaurant = DEMO.restaurant;
  orders = DEMO.orders;
  customers = DEMO.customers;
  menu = normalizeMeny(DEMO.menu);
  enterApp();
}

async function loadSupabaseData() {
  try {
    orders    = await __getOrders(restaurant.id, { limit: 100 });
    customers = await __getCustomers(restaurant.id);
    menu      = normalizeMeny(restaurant.menu) || normalizeMeny(DEMO.menu);
  } catch(e) {
    orders = []; customers = []; menu = normalizeMeny(DEMO.menu);
  }
  enterApp();
}

function enterApp() {
  window.__appLoaded = true;
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  document.getElementById('tbRest').textContent = (restaurant.name||'').toUpperCase();
  const modeEl = document.getElementById('tbMode');
  modeEl.textContent = isDemoMode ? 'DEMO-LÄGE' : '● LIVE';
  modeEl.className = 'tb-mode ' + (isDemoMode ? 'demo' : 'live');
  showTab('overview', document.querySelector('.ntab'));
}

async function doLoggaUt() {
  if (!isDemoMode) __logout().catch(()=>{});
  window.__appLoaded = false;
  restaurant = null; orders = []; customers = []; menu = [];
  document.getElementById('lEmail').value = '';
  document.getElementById('lPass').value = '';
  document.getElementById('lErr').style.display = 'none';
  document.getElementById('lBtn').disabled = false;
  document.getElementById('lBtn').textContent = 'LOGGA IN';
  document.getElementById('app').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
}

function showErr(msg) {
  const e = document.getElementById('lErr');
  e.textContent = msg; e.style.display = 'block';
  document.getElementById('lBtn').disabled = false;
  document.getElementById('lBtn').textContent = 'LOGGA IN';
}

function showTab(tab, btn) {
  currentTab = tab;
  document.querySelectorAll('.ntab').forEach(b=>b.classList.remove('on'));
  if(btn) btn.classList.add('on');
  const c = document.getElementById('content');
  c.scrollTop = 0;
  if (tab === 'overview') c.innerHTML = renderÖversikt();
  else if (tab === 'orders') c.innerHTML = renderOrders();
  else if (tab === 'menu') { c.innerHTML = renderMenyPage('meny'); bindMenySpara(); }
  else if (tab === 'customers') c.innerHTML = renderKunder();
  else if (tab === 'settings') c.innerHTML = renderInställningar();
}

function renderÖversikt() {
  const todayOrders = orders.filter(o => isIdag(o.created_at) && o.status !== 'cancelled');
  const todayRev = todayOrders.reduce((s,o)=>s+(o.total||0),0);
  const monthRev = orders.filter(o=>isThisMonth(o.created_at) && o.status !== 'cancelled').reduce((s,o)=>s+(o.total||0),0);
  const myCut = orders.filter(o=>isThisMonth(o.created_at) && o.status !== 'cancelled').length * 7;
  const avgOrder = orders.length ? (orders.reduce((s,o)=>s+(o.total||0),0)/orders.length) : 0;

  // Best sellers
  const itemCounts = {};
  orders.forEach(o => (o.items||[]).forEach(i => {
    itemCounts[i.name] = (itemCounts[i.name]||{count:0,rev:0});
    itemCounts[i.name].count += (i.quantity||i.qty||1);
    itemCounts[i.name].rev += (i.quantity||i.qty||1)*(i.price||0);
  }));

      <div class="kpi-sub">${orders.filter(o=>isThisMonth(o.created_at)&&o.status!=='cancelled').length} orders × 7 kr</div>
    </div>
    <div class="kpi">
      <div class="kpi-lbl">SNITTORDER</div>
      <div class="kpi-val">${sek(avgOrder)}</div>
      <div class="kpi-sub">${orders.length} totala orders</div>
    </div>
  </div>

  <div class="grid2">
    <div class="card">
      <div class="card-head"><div class="card-title">SENASTE ORDERS</div></div>
      <div class="card-body" style="padding:0;">
        <table class="tbl">
          <thead><tr><th>ORDER</th><th>KUND</th><th>SUMMA</th><th>STATUS</th></tr></thead>
          <tbody>
            ${orders.slice(0,6).map(o=>`
              <tr>
                <td><span class="mono orange">${o.id.slice(0,8).toUpperCase()}</span><br><span class="muted" style="font-size:11px;">${timeAgo(o.created_at)}</span></td>
                <td>${o.customer_name||'—'}</td>
                <td><span class="mono">${sek(o.total||0)}</span></td>
                <td>${statusBadge(o.status)}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <div class="card-head"><div class="card-title">TOPPRÄTTER</div></div>
      <div class="card-body">
        ${sellers.length ? sellers.map(([name,d],i)=>`
          <div class="seller-row">
            <div class="seller-rank">${i+1}</div>
            <div class="seller-info">
              <div class="seller-name">${name}</div>
              <div class="seller-count">${d.count} sålda</div>

            <div class="seller-rev">${sek(d.rev)}</div>

        `).join('') : '<div class="empty">INGA DATA ÄN</div>'}
      </div>
    </div>

function normalizeMeny(raw) {
  if (!raw) return [];
  if (Array.isArray(raw)) return raw;
  const arr = [];
  Object.entries(raw).forEach(([cat, rätter]) => {
    (rätter||[]).forEach(r => arr.push({ ...r, cat: cat.toUpperCase() }));
  });
  return arr;
}

function getMenyCats() {
  const items = normalizeMeny(menu);
  const fromItems = [...new Set(items.map(i => (i.cat||'ÖVRIGT').toUpperCase()))];
  const defaults = ['PIZZA','PASTA','SIDES','DRYCKER','DESSERTER'];
  return [...new Set([...defaults, ...fromItems])];
}

  document.querySelectorAll('.menu-subnav-btn').forEach(b => b.classList.remove('on'));

function tvAddCategoryFromInput() {
  const inp = document.getElementById('tvNewCat');
  if (!inp || !inp.value.trim()) return;
  const name = inp.value.trim().toLowerCase();
  const extras = tvGetExtras();
  if (extras[name]) { alert('Kategorin finns redan.'); return; }
  extras[name] = [{ group: 'Tillval', options: [{ name: '', price: 0 }] }];
  inp.value = '';
  tvRender();
}

function tvGetExtras() {
  if (!restaurant.settings) restaurant.settings = {};
  if (!restaurant.settings.extras) restaurant.settings.extras = {};
  return restaurant.settings.extras;
}

function tvRender() {
  const el = document.getElementById('tvList');
  if (!el) return;
  const extras = tvGetExtras();
  const cats = Object.keys(extras);

  if (cats.length === 0) {
    el.innerHTML = '<div style="background:var(--s2);border:1.5px dashed var(--bdr);border-radius:12px;padding:32px;text-align:center;"><div style="font-family:var(--fm);font-size:10px;letter-spacing:1.5px;color:var(--mt);">INGA TILLVAL ÄNNU — KLICKA + NY KATEGORI</div></div>';
    return;
  }

  var html = '';
  cats.forEach(function(cat) {
    html += '<div class="tv-cat-block">';
    html += '<div class="tv-cat-hdr">';
    html += '<input value="' + cat + '" class="tv-opt-inp" style="max-width:200px;font-weight:600;font-size:12px;letter-spacing:1px;" onchange="tvRenameCategory(' + "'" + cat + "'" + ', this.value)">';
    html += '<button class="tv-del-btn" onclick="tvDeleteCategory(' + "'" + cat + "'" + ')" title="Ta bort kategori">✕</button>';
    html += '</div>';

    var groups = extras[cat] || [];
    groups.forEach(function(group, gi) {
      html += '<div class="tv-group-hdr">';
      html += '<input value="' + (group.group||'') + '" class="tv-opt-inp" style="background:transparent;border:none;border-bottom:1px solid var(--bdr);border-radius:0;padding:4px 0;font-family:var(--fm);font-size:9px;letter-spacing:2px;color:var(--or);" onchange="tvRenameGroup(' + "'" + cat + "'" + ',' + gi + ',this.value)">';
      html += '<button class="tv-del-btn" onclick="tvDeleteGroup(' + "'" + cat + "'" + ',' + gi + ')" style="font-size:12px;">✕ grupp</button>';
      html += '</div>';

      var opts = group.options || [];
      opts.forEach(function(opt, oi) {
        html += '<div class="tv-opt-row">';
        html += '<input class="tv-opt-inp" value="' + (opt.name||'') + '" placeholder="Tillvalsnamn" onchange="tvUpdateOpt(' + "'" + cat + "'" + ',' + gi + ',' + oi + ",'name'" + ',this.value)">';
        html += '<input class="tv-price-inp" type="number" value="' + (opt.price||0) + '" min="0" placeholder="Pris" onchange="tvUpdateOpt(' + "'" + cat + "'" + ',' + gi + ',' + oi + ",'price'" + ',+this.value)">';
        html += '<span style="font-family:var(--fm);font-size:10px;color:var(--mt);">kr</span>';
        html += '<button class="tv-del-btn" onclick="tvDeleteOpt(' + "'" + cat + "'" + ',' + gi + ',' + oi + ')">✕</button>';
        html += '</div>';
      });

      html += '<div class="tv-add-opt-btn"><button class="tv-add-btn" onclick="tvAddOpt(' + "'" + cat + "'" + ',' + gi + ')">+ TILLVAL</button></div>';
    });

    html += '<div style="padding:10px 18px;border-top:1px solid var(--bdr);">';
    html += '<button class="tv-add-btn" onclick="tvAddGroup(' + "'" + cat + "'" + ')">+ NY GRUPP</button>';
    html += '</div></div>';
  });

  el.innerHTML = html;
}

function tvAddCategory() {
  const extras = tvGetExtras();
  let name = 'Ny kategori';
  let i = 1;
  while (extras[name]) name = 'Ny kategori ' + (i++);
  extras[name] = [{ group: 'Tillval', options: [{ name: '', price: 0 }] }];
  tvRender();
}

function tvRenameCategory(oldName, newName) {
  if (oldName === newName || !newName.trim()) return;
  const extras = tvGetExtras();
  const val = extras[oldName];
  delete extras[oldName];
  extras[newName.trim()] = val;
  tvRender();
}

function tvDeleteCategory(cat) {
  if (!confirm('Ta bort kategorin "' + cat + '" och alla dess tillval?')) return;
  delete tvGetExtras()[cat];
  tvRender();
}

function tvAddGroup(cat) {
  tvGetExtras()[cat].push({ group: 'Ny grupp', options: [{ name: '', price: 0 }] });
  tvRender();
}

function tvRenameGroup(cat, gi, val) {
  tvGetExtras()[cat][gi].group = val;
}

function tvDeleteGroup(cat, gi) {
  tvGetExtras()[cat].splice(gi, 1);
  tvRender();
}

function tvAddOpt(cat, gi) {
  tvGetExtras()[cat][gi].options.push({ name: '', price: 0 });
  tvRender();
}

function tvUpdateOpt(cat, gi, oi, field, val) {
  tvGetExtras()[cat][gi].options[oi][field] = val;
}

function tvDeleteOpt(cat, gi, oi) {
  tvGetExtras()[cat][gi].options.splice(oi, 1);
  tvRender();
}

async function tvSaveAll() {
  const btn = document.querySelector('.tv-save-all-btn');
  if (btn) { btn.textContent = 'SPARAR...'; btn.disabled = true; }
  try {
    await __updateRestaurant(restaurant.id, {
      settings: { ...(restaurant.settings || {}), extras: tvGetExtras() }
    });
    if (btn) { btn.textContent = '✓ SPARAT'; setTimeout(() => { btn.textContent = 'SPARA TILLVAL'; btn.disabled = false; }, 2000); }
  } catch(e) {
    if (btn) { btn.textContent = 'FEL — FÖRSÖK IGEN'; btn.disabled = false; }
  }
}

function bindMenySpara() {
  // Spara-knappar
  document.querySelectorAll('.meny-save-btn').forEach(btn => {
    btn.addEventListener('click', () => saveMenyPris(btn.dataset.id, btn));
  });
  // Enter i prisfält
  document.querySelectorAll('.meny-price-inp').forEach(inp => {
    inp.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        const saveBtn = document.querySelector(`.meny-save-btn[data-id="${inp.dataset.id}"]`);
        if (saveBtn) saveBtn.click();
      }
    });
  });
  // Ta bort-knappar
  document.querySelectorAll('.meny-del-btn').forEach(btn => {
    btn.addEventListener('click', () => removeMenyItem(btn.dataset.del));
  });
}

async function addMenyItem() {
  const name  = document.getElementById('newMenyName').value.trim();
  const cat   = document.getElementById('newMenyCat').value;
  const price = parseFloat(document.getElementById('newMenyPris').value)||0;
  if (!name)  { alert('Fyll i namn på rätten.'); return; }
  if (!price) { alert('Fyll i ett pris.'); return; }

  const items = normalizeMeny(menu);
  items.push({ id: String(Date.now()), name, cat, price });
  menu = items;

  // Rensa fälten
  document.getElementById('newMenyName').value = '';
  document.getElementById('newMenyPris').value = '';

  await saveMenyToSupabase();
  refreshMenyUI();
}

function addMenyKategori() {
  const inp = document.getElementById('newCatName');
  const val = inp.value.trim().toUpperCase();
  if (!val) return;
  // Sätt som valt alternativ i select
  const sel = document.getElementById('newMenyCat');
  if (![...sel.options].some(o => o.value === val)) {
    const opt = document.createElement('option');
    opt.value = val; opt.textContent = val;
    sel.appendChild(opt);
  }
  sel.value = val;
  inp.value = '';
}

async function removeMenyItem(rättId) {
  if (!confirm('Ta bort rätten?')) return;
  menu = normalizeMeny(menu).filter(i => i.id !== rättId);
  await saveMenyToSupabase();
  refreshMenyUI();
}

async function saveMenyPris(rättId, btn) {
  const inp = document.querySelector(`.meny-price-inp[data-id="${rättId}"]`);
  if (!inp) return;
  const price = parseFloat(inp.value)||0;
  if (btn) { btn.textContent = 'SPARAR...'; btn.disabled = true; }

  const items = normalizeMeny(menu);
  const item = items.find(i => i.id === rättId);
  if (item) item.price = price;
  menu = items;

  await saveMenyToSupabase(btn);
  if (btn) btn.disabled = false;
}

async function saveMenyToSupabase(btn) {
  if (isDemoMode) {
    if (btn) { btn.textContent='✓ DEMO'; btn.classList.add('saved'); setTimeout(()=>{ btn.textContent='SPARA'; btn.classList.remove('saved'); },2000); }
    return;
  }
  try {
    await __updateRestaurant(restaurant.id, { menu });
    restaurant.menu = menu;
    if (btn) { btn.textContent='✓ SPARAT'; btn.classList.add('saved'); setTimeout(()=>{ btn.textContent='SPARA'; btn.classList.remove('saved'); },2000); }
  } catch(e) {
    if (btn) { btn.textContent='FEL'; setTimeout(()=>{ btn.textContent='SPARA'; },3000); }
    console.error('Meny-spara fel:', e);
  }
}

function renderKunder() {
  const now = new Date();
  const lapsed = customers.filter(c => {
    const d = c.last_order_at ? new Date(c.last_order_at) : new Date(0);
    return (now-d)/(1000*86400) > 14;
  });

  return `

  <div class="kpi-strip" style="grid-template-columns:repeat(4,1fr);margin-bottom:16px;">
    <div class="kpi"><div class="kpi-lbl">TOTALT</div><div class="kpi-val">${customers.length}</div></div>
    <div class="kpi"><div class="kpi-lbl">ÅTERKOMMANDE</div><div class="kpi-val green">${customers.filter(c=>(c.total_orders||0)>1).length}</div></div>
    <div class="kpi"><div class="kpi-lbl">INAKTIVA (14+ DGR)</div><div class="kpi-val red">${lapsed.length}</div></div>
    <div class="kpi"><div class="kpi-lbl">SNITT ORDERS/KUND</div><div class="kpi-val">${customers.length?(customers.reduce((s,c)=>s+(c.total_orders||0),0)/customers.length).toFixed(1):0}</div></div>
  </div>
  <div class="card">
    <table class="tbl">
      <thead><tr><th>KUND</th><th>TELEFON</th><th>ORDERS</th><th>TOTALT SPENDERAT</th><th>POÄNG</th><th>SENASTE ORDER</th><th>STATUS</th></tr></thead>
      <tbody>
        ${customers.map(c=>{
          const d = c.last_order_at ? new Date(c.last_order_at) : new Date(0);
          const days = Math.floor((now-d)/86400000);
          const isLapsed = days > 14;
          const initials = (c.name||'?').split(' ').map(n=>n[0]).join('').slice(0,2).toUpperCase();
          return `<tr class="cust-row">
            <td>
              <div class="cust-avatar">${initials}</div>
              <div><div style="font-weight:600;">${c.name}</div><div style="font-size:11px;color:var(--mt);">${c.email||''}</div></div>
            </td>
            <td><span class="mono" style="font-size:11px;">${c.phone||'—'}</span></td>
            <td><span class="mono orange">${c.total_orders||0}</span></td>
            <td><span class="mono">${sek(c.total_spent||0)}</span></td>
            <td><span class="mono" style="color:var(--or);">⭐ ${c.loyalty_points||0}</span></td>
            <td><span style="font-family:var(--fm);font-size:10px;color:var(--mt);">${timeAgo(d)}</span></td>
            <td><span class="badge ${isLapsed?'badge-cancelled':'badge-done'}">${isLapsed?'INAKTIV':'AKTIV'}</span></td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
  </div>
  `;
}

async function testSMS(btn) {
  if (!restaurant.sms_api_username || !restaurant.sms_api_password) {
    alert('Fyll i API-användare och lösenord först, sedan spara — och testa igen.');
    return;
  }
  if (!restaurant.sms_sender_name) {
    alert('Fyll i ett avsändarnamn först.');
    return;
  }
  const phone = prompt('Vilket telefonnummer ska testmeddelandet skickas till?\n(Format: +46701234567)');
  if (!phone) return;
  btn.textContent = 'SKICKAR...'; btn.disabled = true;
  try {
    const res = await fetch('/sms', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        api_username: restaurant.sms_api_username,
        api_password: restaurant.sms_api_password,
        from: restaurant.sms_sender_name,
        to: phone,
        message: `Hej! Det här är ett testmeddelande från ${restaurant.name} via Crustly. SMS fungerar! 🍕`
      })
    });
    const data = await res.json();
    if (data.success) {
      btn.textContent = '✓ SKICKAT'; btn.style.color = 'var(--green)';
    } else {
      alert('Fel: ' + (data.error || 'Okänt fel'));
      btn.textContent = '📱 TESTA SMS';
    }
  } catch(e) {
    alert('Kunde inte nå SMS-tjänsten. Är Cloudflare Worker uppdaterad?');
    btn.textContent = '📱 TESTA SMS';
  }
  btn.disabled = false;
  setTimeout(() => { btn.textContent = '📱 TESTA SMS'; btn.style.color = ''; }, 3000);
}


async function saveInställningar(btn) {
  btn.textContent = 'SPARAR...'; btn.disabled = true;
  if (!isDemoMode) {
    try {
      const result = await __updateRestaurant(restaurant.id, {
        name:          restaurant.name,
        address:       restaurant.address,
        phone:         restaurant.phone,
        opening_hours: restaurant.opening_hours,
        is_open:       restaurant.isÖppet ?? true,
        settings:      restaurant.settings || {},
        closed_message:  restaurant.closed_message || null,
        kitchen_pin:     restaurant.kitchen_pin || null,
        sms_sender_name:  restaurant.sms_sender_name || null,
        sms_api_username: restaurant.sms_api_username || null,
        sms_api_password: restaurant.sms_api_password || null,
        settings: {
          ...(restaurant.settings || {}),
          extras: restaurant.settings?.extras || {}
        },
      });
      if (result?.success) {
        restaurant = { ...restaurant, ...result.restaurant };
        document.getElementById('tbRest').textContent = (restaurant.name||'').toUpperCase();
        btn.textContent = '✓ SPARAT'; btn.style.background = 'var(--green)';
      } else {
        btn.textContent = '⚠ FEL VID SPARNING'; btn.style.background = '#e74c3c';
      }
    } catch(e) {
      console.error('saveInställningar error:', e);
      btn.textContent = '⚠ FEL'; btn.style.background = '#e74c3c';
    }
  } else {
    btn.textContent = '✓ DEMO (ej sparat)'; btn.style.background = 'var(--mt)';
  }
  setTimeout(()=>{ btn.textContent='SPARA ÄNDRINGAR'; btn.style.background='var(--orange)'; btn.disabled=false; }, 2000);
}

// ============================================================
// UTILS
// ============================================================
function sek(v){ return Number(v).toLocaleString('sv-SE',{minimumFractionDigits:0,maximumFractionDigits:0})+' kr'; }

function timeAgo(d) {
  if(!d) return '—';
  let date;
  if (d instanceof Date) { date = d; }
  else if (typeof d === 'number') { date = new Date(d); }
  else { date = new Date(d); }
  if (isNaN(date.getTime())) return '—';
  const mins = Math.floor((Date.now() - date.getTime()) / 60000);
  if (mins < 1)  return 'just nu';
  if (mins < 60) return `${mins} min sedan`;
  const hrs = Math.floor(mins / 60);
  if (hrs < 24)  return `${hrs} tim sedan`;
  const days = Math.floor(hrs / 24);
  if (days < 30) return `${days} ${days === 1 ? 'dag' : 'dagar'} sedan`;
  const months = Math.floor(days / 30);
  return `${months} ${months === 1 ? 'månad' : 'månader'} sedan`;
}

function isIdag(d) {
  if(!d) return false;
  const date = d instanceof Date ? d : (d?.toDate ? d.toDate() : new Date(d));
  const now = new Date();
  return date.toDateString() === now.toDateString();
}

function isThisMonth(d) {
  if(!d) return false;
  const date = d instanceof Date ? d : (d?.toDate ? d.toDate() : new Date(d));
  const now = new Date();
  return date.getMonth()===now.getMonth() && date.getFullYear()===now.getFullYear();
}

function statusBadge(s) {
  const map = { new:'badge-new', preparing:'badge-preparing', ready:'badge-preparing', done:'badge-done', cancelled:'badge-cancelled' };
  return `<span class="badge ${map[s]||''}">${s||'—'}</span>`;
}
