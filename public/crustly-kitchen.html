<script>
// ── Supabase via fetch — ingen CDN behövs ──

async function sbFetch(path, opts={}) {
  const res = await fetch(SUPA_URL + '/rest/v1/' + path, {
    ...opts,
    headers: {
      'apikey': SUPA_KEY,
      'Authorization': 'Bearer ' + SUPA_KEY,
      'Content-Type': 'application/json',
      'Prefer': opts.prefer || 'return=representation',
      ...(opts.headers||{})
    }
  });
  if (!res.ok) return null;
  return res.json();
}

async function listenToOrders(restaurantId, callback) {
  // Initial load
  const data = await sbFetch(
    'orders?restaurant_id=eq.' + restaurantId +
    '&status=in.(new,progress,awaiting,done)' +
    '&order=created_at.desc&limit=100'
  );
  if (data) callback(data);

  // Poll every 5s instead of realtime
  setInterval(async () => {
    const fresh = await sbFetch(
      'orders?restaurant_id=eq.' + restaurantId +
      '&status=in.(new,progress,awaiting,done)' +
      '&order=created_at.desc&limit=100'
    );
    if (fresh) callback(fresh);
  }, 5000);
}

async function updateOrderStatus(orderId, status) {
  const res = await fetch(SUPA_URL + '/rest/v1/orders?id=eq.' + orderId, {
    method: 'PATCH',
    headers: {
      'apikey': SUPA_KEY,
      'Authorization': 'Bearer ' + SUPA_KEY,
      'Content-Type': 'application/json',
      'Prefer': 'return=minimal'
    },
    body: JSON.stringify({ status })
  });
  return res.ok;
}

async function confirmPayment(orderId) {
  const res = await fetch(SUPA_URL + '/rest/v1/orders?id=eq.' + orderId, {
    method: 'PATCH',
    headers: {
      'apikey': SUPA_KEY,
      'Authorization': 'Bearer ' + SUPA_KEY,
      'Content-Type': 'application/json',
      'Prefer': 'return=minimal'
    },
    body: JSON.stringify({ status: 'progress', payment_status: 'paid' })
  });
  return res.ok;
}

<style>
:root {
  --bg:#0a0908;
  --surf:#131110;
  --surf2:#1a1816;
  --bdr:#252220;
  --bdr2:#302d28;
  --orange:#f06020;
  --yellow:#f0b020;
  --green:#28c060;
  --red:#e03030;
  --tx:#f0ece0;
  --tx2:#c0bca8;
  --mt:#686058;
  --fd:'Bebas Neue',sans-serif;
  --fm:'DM Mono',monospace;
  --fb:'DM Sans',sans-serif;
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{background:var(--bg);color:var(--tx);font-family:var(--fb);display:flex;flex-direction:column;}

/* ── TOPBAR ── */
.topbar{
  background:var(--surf);border-bottom:2px solid var(--bdr);
  height:60px;flex-shrink:0;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;
}
.tb-left{display:flex;align-items:center;gap:12px;}
.tb-logo{font-family:var(--fd);font-size:22px;color:var(--orange);letter-spacing:2px;}
.tb-sep{width:1px;height:28px;background:var(--bdr2);}
.tb-rest{font-family:var(--fd);font-size:20px;letter-spacing:1.5px;color:var(--tx2);}
.tb-clock{font-family:var(--fm);font-size:18px;color:var(--tx);letter-spacing:2px;}

.tb-right{display:flex;align-items:center;gap:8px;}
.stat-pill{
  display:flex;flex-direction:column;align-items:center;
  background:var(--surf2);border:1.5px solid var(--bdr);
  border-radius:8px;padding:4px 12px;min-width:52px;
}
.stat-num{font-family:var(--fd);font-size:20px;line-height:1;}
.stat-lbl{font-family:var(--fm);font-size:7px;letter-spacing:1.5px;color:var(--mt);margin-top:1px;}
.stat-pill.orange .stat-num{color:var(--orange);}
.stat-pill.yellow .stat-num{color:var(--yellow);}
.stat-pill.green .stat-num{color:var(--green);}

/* ── FILTER BAR ── */
.filterbar{
  background:var(--surf);border-bottom:1.5px solid var(--bdr);
  padding:8px 16px;display:flex;align-items:center;gap:8px;flex-shrink:0;
  overflow-x:auto;scrollbar-width:none;
}
.filterbar::-webkit-scrollbar{display:none;}
.fbtn{
  font-family:var(--fm);font-size:11px;letter-spacing:2px;
  padding:8px 16px;border-radius:7px;cursor:pointer;border:none;
  background:var(--surf2);color:var(--mt);transition:all .15s;white-space:nowrap;
  -webkit-user-select:none;user-select:none;
}
.fbtn:active{transform:scale(.96);}
.fbtn.on{background:var(--orange);color:#fff;}
.fbtn.yellow.on{background:var(--yellow);color:#000;}
.fbtn.green.on{background:var(--green);color:#000;}
.filter-sep{width:1px;height:24px;background:var(--bdr2);flex-shrink:0;}

/* ── BOARD ── */
.board{
  flex:1;overflow-x:auto;overflow-y:auto;padding:14px;
  display:grid;
  grid-template-columns:repeat(auto-fill,320px);
  grid-auto-rows:min-content;
  gap:14px;align-content:start;
  scrollbar-width:thin;scrollbar-color:var(--bdr2) transparent;
}

/* ── ORDER CARD ── */
.ocard{
  background:var(--surf);border:2px solid var(--bdr);
  border-radius:14px;overflow:hidden;display:flex;flex-direction:column;
  transition:border-color .2s;min-width:300px;width:320px;
}
.ocard.new{border-color:var(--orange);}
.ocard.progress{border-color:var(--yellow);}
.ocard.done{border-color:var(--green);opacity:.7;}
.ocard.urgent{border-color:var(--red);animation:urgentPulse 1.5s ease-in-out infinite;}
@keyframes urgentPulse{0%,100%{border-color:var(--red)}50%{border-color:#ff606080}}
.ocard.awaiting{border-color:#a78bfa;animation:swishPulse 2s ease-in-out infinite;}
@keyframes swishPulse{0%,100%{border-color:#a78bfa}50%{border-color:#a78bfa60}}

/* Card top stripe */
.card-stripe{height:4px;}
.ocard.new .card-stripe{background:var(--orange);}
.ocard.progress .card-stripe{background:var(--yellow);}
.ocard.done .card-stripe{background:var(--green);}
.ocard.urgent .card-stripe{background:var(--red);}
.ocard.awaiting .card-stripe{background:#a78bfa;}

/* Card header */
.card-top{padding:12px 14px;display:flex;justify-content:space-between;align-items:flex-start;border-bottom:1px solid var(--bdr);}
.card-num{font-family:var(--fd);font-size:30px;letter-spacing:2px;line-height:1;}
.ocard.new .card-num{color:var(--orange);}
.ocard.progress .card-num{color:var(--yellow);}
.ocard.done .card-num{color:var(--green);}
.ocard.urgent .card-num{color:var(--red);}
.ocard.awaiting .card-num{color:#a78bfa;}
.btn-confirm{background:#a78bfa;color:#fff;flex:1;}
.btn-confirm:hover{background:#c4b5fd;}

.card-meta{display:flex;flex-direction:column;align-items:flex-end;gap:4px;}
.timer{font-family:var(--fm);font-size:16px;letter-spacing:1px;font-weight:500;}
.timer.ok{color:var(--green);}
.timer.warn{color:var(--yellow);}
.timer.hot{color:var(--red);}
.type-tag{font-family:var(--fm);font-size:9px;letter-spacing:1.5px;padding:3px 8px;border-radius:4px;}
.type-delivery{background:#f0602018;color:var(--orange);}
.type-pickup{background:#28c06018;color:var(--green);}

/* Customer */
.card-customer{padding:10px 14px;border-bottom:1px solid var(--bdr);display:flex;justify-content:space-between;align-items:center;}
.cust-name{font-size:15px;font-weight:700;color:var(--tx);}
.cust-addr{font-size:11px;color:var(--mt);margin-top:2px;font-family:var(--fm);}
.cust-phone{font-family:var(--fm);font-size:12px;color:var(--tx2);}

/* Items */
.card-rätter{padding:10px 14px;flex:1;border-bottom:1px solid var(--bdr);}
.rätt-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--bdr);}
.rätt-row:last-child{border-bottom:none;}
.rätt-qty{font-family:var(--fd);font-size:28px;color:var(--orange);width:32px;text-align:center;line-height:1;flex-shrink:0;}
.rätt-name{font-size:16px;font-weight:700;flex:1;}
.rätt-price{font-family:var(--fm);font-size:12px;color:var(--mt);}

/* Notes */
.card-notes{background:#f0b02010;border-top:1px solid #f0b02030;padding:8px 14px;font-size:13px;color:var(--yellow);display:flex;gap:6px;align-items:flex-start;}

/* Footer */
.card-foot{padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
.card-total{font-family:var(--fd);font-size:26px;letter-spacing:1px;color:var(--tx);}
.card-actions{display:flex;gap:8px;}

/* Action buttons — big for touch */
.btn-act{
  height:48px;border:none;border-radius:9px;
  font-family:var(--fd);font-size:18px;letter-spacing:2px;
  cursor:pointer;transition:all .15s;padding:0 20px;
  -webkit-user-select:none;user-select:none;
}
.btn-act:active{transform:scale(.94);}
.btn-start{background:var(--orange);color:#fff;}
.btn-start:hover{background:#ff7040;}
.btn-print{background:#334155;color:#fff;font-size:14px;padding:0 12px;}
.btn-print:hover{background:#475569;}
.btn-done{background:var(--green);color:#000;flex:1;}
.btn-done:hover{background:#38d070;}
.btn-undo{background:var(--surf2);color:var(--mt);border:1.5px solid var(--bdr2);}
.btn-undo:hover{border-color:var(--mt);}
.btn-bump{background:var(--surf2);color:var(--tx2);border:1.5px solid var(--bdr2);font-size:20px;width:48px;padding:0;}

.done-label{font-family:var(--fm);font-size:11px;color:var(--green);letter-spacing:1.5px;}

/* ── EMPTY STATE ── */
.empty-board{
  grid-column:1/-1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:80px 20px;
  opacity:.5;
}
.empty-icon{font-size:64px;margin-bottom:16px;}
.empty-title{font-family:var(--fd);font-size:32px;letter-spacing:3px;color:var(--mt);}
.empty-sub{font-family:var(--fm);font-size:11px;color:var(--mt);letter-spacing:2px;margin-top:8px;}

/* ── DEMO BANNER ── */
.demo-bar{
  background:#f0b02018;border-bottom:1.5px solid #f0b02030;
  padding:8px 16px;text-align:center;
  font-family:var(--fm);font-size:10px;letter-spacing:2px;color:var(--yellow);
  flex-shrink:0;display:flex;align-items:center;justify-content:center;gap:12px;

.btn-add-demo{
  background:#f0b02030;border:1px solid #f0b02060;color:var(--yellow);

/* ── TABLET ADJUSTMENTS ── */
@media(min-width:768px) and (max-width:1024px){

  .topbar{height:54px;}
  .stat-pill{display:none;}
  .tb-clock{font-size:15px;}
}
</style>

      if (_pinEntered === _kitchenPin) {
        sessionStorage.setItem('kitchen_pin_ok', _kitchenPin);
        document.getElementById('pinScreen').style.display = 'none';
        startKitchen();
      } else {
        document.getElementById('pinError').textContent = 'FEL PIN — FÖRSÖK IGEN';
        _pinEntered = '';
        for (let i = 0; i < 4; i++) {
          const dot = document.getElementById('dot' + i);
          dot.style.background = '#e74c3c';
          dot.style.borderColor = '#e74c3c';
        }
        setTimeout(() => {
          document.getElementById('pinError').textContent = '';
          for (let i = 0; i < 4; i++) {
            document.getElementById('dot' + i).style.background = 'transparent';
            document.getElementById('dot' + i).style.borderColor = '#444';
          }
        }, 800);
      }
    }, 150);
  }
}

function tryFirebase() {
  try {
    const restaurantId = new URLSearchParams(window.location.search).get('r');
    if (!restaurantId) { loadDemo(); return; }

    // Hämta restaurang + PIN
    sbFetch('restaurants?id=eq.' + restaurantId + '&select=name,kitchen_pin&limit=1').then(data => {
      if (data && data[0]) {
        document.getElementById('tbRest').textContent = data[0].name.toUpperCase();
        _kitchenPin = data[0].kitchen_pin || null;
      }

      // Kontrollera om PIN redan är okej i denna session
      const savedPin = sessionStorage.getItem('kitchen_pin_ok');
      if (!_kitchenPin || savedPin === _kitchenPin) {
        // Ingen PIN satt eller redan inloggad
        document.getElementById('pinScreen').style.display = 'none';
        startKitchen();
      } else {
        // Visa PIN-skärm
        document.getElementById('pinScreen').style.display = 'flex';
      }
    });
  } catch(e) { console.error('init error:', e); loadDemo(); }
}

function startKitchen() {
  const restaurantId = new URLSearchParams(window.location.search).get('r');
  try {
    let knownOrderIds = null;

    listenToOrders(restaurantId, (orderList) => {
      if (!orderList) return;
      isDemoMode = false;
      document.getElementById('demoBanner').style.display = 'none';
      if (orderList.length === 0) {
        orders = [];
        render();
        return;
      }

      // Detect new orders
      const newIds = new Set(orderList.filter(o => o.status === 'new').map(o => o.id));
      if (knownOrderIds !== null) {
        const addedNew = [...newIds].filter(id => !knownOrderIds.has(id));
        if (addedNew.length > 0) {
          playOrderAlert();
        }
      }
      knownOrderIds = newIds;

      orders = orderList.map(o => ({
        ...o,
        items: o.items || [],
        createdAt: o.created_at,
        startedAt: o.updated_at,
      }));
      render();
    });
  } catch(e) {
    console.error('Kitchen error:', e);
    orders = [];
    render();
  }
}

function loadDemo() {
  isDemoMode = true;
  orders = [...DEMO_ORDERS];
  render();
}

// LJUDNOTIS & VISUELL ALERT
// ============================================================
function playOrderAlert() {
  // Ljud via Web Audio API - ingen fil behövs
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    
    function beep(freq, start, duration, vol) {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.frequency.value = freq;
      osc.type = 'sine';
      gain.gain.setValueAtTime(vol, ctx.currentTime + start);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + start + duration);
      osc.start(ctx.currentTime + start);
      osc.stop(ctx.currentTime + start + duration);
    }

    // Tre stigande pip — typisk restaurangnotis
    beep(880, 0,    0.15, 0.4);
    beep(880, 0.18, 0.15, 0.4);
    beep(1100, 0.36, 0.25, 0.5);
  } catch(e) {}

  // Visuell flash på hela skärmen
  const flash = document.getElementById('newOrderFlash');
  if (flash) {
    flash.classList.add('flash-active');
    setTimeout(() => flash.classList.remove('flash-active'), 1000);
  }

  // Blink på page title
  let blinks = 0;
  const orig = document.title;
  const blink = setInterval(() => {
    document.title = blinks % 2 === 0 ? '🔔 NY ORDER!' : orig;
    if (++blinks >= 8) { clearInterval(blink); document.title = orig; }
  }, 400);
}

function render() {
  updateStats();

  let filtered = [...orders];

  if (currentFiltrera === 'active') filtered = filtered.filter(o => o.status==='new' || o.status==='progress' || o.status==='awaiting');
  else if (currentFiltrera !== 'all') filtered = filtered.filter(o => o.status===currentFiltrera);

  // Sortera: new → progress → done, oldest first within group
  const ord = {awaiting:0, new:1, progress:2, done:3};
  filtered.sort((a,b) => {
    if (ord[a.status] !== ord[b.status]) return ord[a.status]-ord[b.status];
    return getTime(a.created_at||a.createdAt) - getTime(b.created_at||b.createdAt);
  });

  const board = document.getElementById('board');
  if (!filtered.length) {
    board.innerHTML = `
      <div class="empty-board">
        <div class="empty-icon">${currentFiltrera==='done'?'✅':'🍕'}</div>
        <div class="empty-title">${currentFiltrera==='done'?'INGA KLARA ORDERS':'INGA AKTIVA ORDERS'}</div>
        <div class="empty-sub">${currentFiltrera==='active'?'VÄNTAR PÅ BESTÄLLNINGAR...':'INGET HÄR ÄN'}</div>
      </div>`;
    return;
  }

  board.innerHTML = filtered.map(o => cardHTML(o)).join('');
  startTimers(filtered);
}

function cardHTML(o) {
  const age = Math.floor((Date.now() - getTime(o.created_at||o.created_at)) / 60000);
  const isUrgent = o.status === 'new' && age >= 12;
  const cardClass = isUrgent ? 'urgent' : o.status;
  const timerClass = age >= 12 ? 'hot' : age >= 7 ? 'warn' : 'ok';
  const typeLabel = o.delivery_type === 'delivery' ? '🛵 LEVERANS' : '🏠 AVHÄMTNING';
  const typeClass = o.delivery_type === 'delivery' ? 'type-delivery' : 'type-pickup';
  const swishTag = o.payment_method_method === 'swish' ? `<div class="type-tag" style="background:#a78bfa18;color:#a78bfa;">📱 SWISH</div>` : '';

  const itemsHtml = (o.items||[]).map(i => `
    <div class="rätt-row">
      <div class="rätt-qty">${i.quantity||i.qty||1}×</div>
      <div class="rätt-name">${i.name}</div>
      <div class="rätt-price">${sek((i.price||0)*(i.quantity||1))}</div>
    </div>
  `).join('');

  const notesHtml = o.special_instructions ? `<div class="card-notes">📝 ${o.special_instructions}</div>` : '';

  let actionsHtml;
  if (o.status === 'done') {
    actionsHtml = `<div class="card-actions"><div class="done-label">✓ KLAR</div><button class="btn-act btn-print" onclick='printOrderTicket(orders.find(o=>o.id=="${o.id}"))' title="Skriv ut igen">🖨</button></div>`;
  } else if (o.status === 'awaiting') {
    actionsHtml = `
      <div class="card-actions" style="flex:1;">
        <button class="btn-act btn-confirm" onclick="confirmBetalning('${o.id}')">📱 BEKRÄFTA SWISH</button>
      </div>`;
  } else if (o.status === 'new') {
    actionsHtml = `
      <div class="card-actions">
        <button class="btn-act btn-bump" onclick="bump('${o.id}')" title="Prioritera">⬆</button>
        <button class="btn-act btn-start" onclick="setStatus('${o.id}','progress')">START →</button>
      </div>`;
  } else {
    actionsHtml = `
      <div class="card-actions" style="flex:1;">
        <button class="btn-act btn-undo" onclick="setStatus('${o.id}','new')">↩</button>
        <button class="btn-act btn-print" onclick='printOrderTicket(orders.find(o=>o.id=="${o.id}"))' title="Skriv ut igen">🖨</button>
        <button class="btn-act btn-done" onclick="setStatus('${o.id}','done')">✓ KLAR</button>
      </div>`;
  }

  return `
    <div class="ocard ${cardClass}" id="c-${o.id}">
      <div class="card-stripe"></div>
      <div class="card-top">
        <div>
          <div class="card-num">${o.num||('#'+o.id.slice(-4).toUpperCase())}</div>
          ${o.status==='awaiting'?'<div style="font-family:var(--fm);font-size:9px;letter-spacing:1.5px;color:#a78bfa;margin-top:3px;">VÄNTAR PÅ SWISH</div>':''} 
        </div>
        <div class="card-meta">
          <div class="timer ${timerClass}" id="t-${o.id}">${fmtAge(age)}</div>
          <div class="type-tag ${typeClass}">${typeLabel}</div>
          ${swishTag}
        </div>
      </div>
      <div class="card-customer">
        <div>
          <div class="cust-name">${o.customer_name||'—'}</div>
          <div class="cust-addr">${o.delivery_address||''}</div>
        </div>
        <div class="cust-phone">${o.customer_phone||''}</div>
      </div>
      <div class="card-rätter">${itemsHtml}</div>
      ${notesHtml}
      <div class="card-foot">
        <div class="card-total">${sek(o.total||0)}</div>
        ${actionsHtml}
      </div>
    </div>
  `;
}

function confirmBetalning(id) {
  // Mark payment confirmed → move to 'new' so kitchen can start it
  const idx = orders.findIndex(o => o.id === id);
  if (idx < 0) return;
  orders[idx].status = 'new';
  orders[idx].paymentConfirmed = true;
  render();
  if (!isDemoMode) {
    try {
      confirmPayment(id);
    } catch(e){}
  }
}

function setStatus(id, newStatus) {
  const idx = orders.findIndex(o => o.id === id);
  if (idx < 0) return;
  orders[idx].status = newStatus;
  if (newStatus === 'progress') {
    orders[idx].startedAt = new Date();
    // Print ticket when kitchen accepts order
    printOrderTicket(orders[idx]);
  }
  if (newStatus === 'done') orders[idx].completedAt = new Date();
  render();

  // Supabase save
  if (!isDemoMode) {
    try {
      updateOrderStatus(id, newStatus);
    } catch(e){}
  }
}

function bump(id) {
  // Move to front av new orders
  const idx = orders.findIndex(o => o.id === id);
  if (idx < 0) return;
  const o = orders.splice(idx, 1)[0];
  o.created_at = new Date(Date.now() + 60000); // small cheat to sort first
  orders.unshift(o);
  render();
}

// ============================================================
// TIMERS
// ============================================================
function startTimers(filtered) {
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    filtered.forEach(o => {
      const el = document.getElementById('t-'+o.id);
      if (!el) return;
      const age = Math.floor((Date.now()-getTime(o.created_at||o.created_at))/60000);
      el.textContent = fmtAge(age);
      el.className = 'timer '+(age>=12?'hot':age>=7?'warn':'ok');
      // Flash card red if urgent new order
      const card = document.getElementById('c-'+o.id);
      if (card && o.status==='new' && age>=12) card.className='ocard urgent';
    });
  }, 30000);
}

function startClock() {
  const el = document.getElementById('clock');
  const tick = () => {
    const now = new Date();
    el.textContent = now.toLocaleTimeString('sv-SE',{hour:'2-digit',minute:'2-digit'});
  };
  tick();
  setInterval(tick, 10000);
}

// ============================================================
// UTILS
// ============================================================
function sek(v){ return Math.round(v)+' kr'; }
function fmtAge(m){ if(m<1) return '< 1 MIN'; if(m<60) return m+' MIN'; return Math.floor(m/60)+'H '+m%60+'M'; }
function getTime(d){ if(!d) return Date.now(); if(d instanceof Date) return d.getTime(); if(d?.toDate) return d.toDate().getTime(); return new Date(d).getTime(); }
